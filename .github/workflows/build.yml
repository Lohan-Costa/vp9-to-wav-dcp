name: Build

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            ffmpeg_url: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64'
            ffprobe_url: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-darwin-arm64'
            ffmpeg_bin:  'ffmpeg-aarch64-apple-darwin'
            ffprobe_bin: 'ffprobe-aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
            ffmpeg_url: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64'
            ffprobe_url: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-win32-x64'
            ffmpeg_bin:  'ffmpeg-x86_64-pc-windows-msvc.exe'
            ffprobe_bin: 'ffprobe-x86_64-pc-windows-msvc.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm install

      - name: Download FFmpeg sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries
          curl -L "${{ matrix.ffmpeg_url }}"  -o "src-tauri/binaries/${{ matrix.ffmpeg_bin }}"
          curl -L "${{ matrix.ffprobe_url }}" -o "src-tauri/binaries/${{ matrix.ffprobe_bin }}"
          chmod +x "src-tauri/binaries/${{ matrix.ffmpeg_bin }}"
          chmod +x "src-tauri/binaries/${{ matrix.ffprobe_bin }}"

      - name: Download FFmpeg sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries
          Invoke-WebRequest -Uri "${{ matrix.ffmpeg_url }}"  -OutFile "src-tauri\binaries\${{ matrix.ffmpeg_bin }}"
          Invoke-WebRequest -Uri "${{ matrix.ffprobe_url }}" -OutFile "src-tauri\binaries\${{ matrix.ffprobe_bin }}"

      - name: Generate Tauri icons
        run: |
          npx @tauri-apps/cli icon src-tauri/icons/icon-source.png || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('VP9 para WAV {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Download

            ### macOS (Apple Silicon)
            Baixe o arquivo **`VP9.para.WAV_installer.dmg`** — ele inclui um script de instalação automática:
            1. Abra o `.dmg`
            2. Dê duplo clique em **`Instalar.command`**
            3. O Terminal abrirá, copiará o app e removerá o bloqueio do macOS automaticamente

            > Se preferir instalar manualmente: baixe o `.dmg` padrão, mova o app para Applications e execute `xattr -cr "/Applications/VP9 para WAV.app"` no Terminal.

            ### Windows
            - Baixe o `.exe` e execute diretamente
            - Se o SmartScreen alertar, clique em **"Mais informações" → "Executar mesmo assim"**
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create installer DMG with setup script (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          APP_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          echo "App encontrado: $APP_PATH"

          mkdir -p dmg-staging
          cp -r "$APP_PATH" "dmg-staging/VP9 para WAV.app"
          ln -s /Applications "dmg-staging/Applications"

          cat > "dmg-staging/Instalar.command" << 'SCRIPT'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          SRC="$DIR/VP9 para WAV.app"
          DEST="/Applications/VP9 para WAV.app"

          echo ""
          echo "=== Instalador VP9 para WAV ==="
          echo ""

          if [ -d "$SRC" ]; then
            echo "Copiando para /Applications..."
            cp -r "$SRC" "$DEST"
          fi

          echo "Removendo restrição do macOS..."
          xattr -cr "$DEST"

          echo "Instalação concluída! Abrindo o app..."
          open "$DEST"
          SCRIPT

          chmod +x "dmg-staging/Instalar.command"

          DMG_NAME="VP9.para.WAV_installer.dmg"
          hdiutil create \
            -volname "VP9 para WAV" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "$DMG_NAME"

          gh release upload "$TAG" "$DMG_NAME"
