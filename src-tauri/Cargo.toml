[package]
name = "vp9-to-wav-dcp"
version = "0.3.0"
description = "Conversor de vídeo VP9 para WAV PCM conforme ISDCF Doc 13"
authors = ["Lohan Costa"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vp9_to_wav_dcp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vp9-to-wav-dcp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }
anyhow           = "1"
log              = "0.4"
env_logger       = "0.11"
tempfile         = "3"
